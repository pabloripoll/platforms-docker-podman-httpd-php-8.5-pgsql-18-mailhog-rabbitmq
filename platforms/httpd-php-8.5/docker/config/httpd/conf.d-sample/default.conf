<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/public

    # Logging
    ErrorLog /dev/stderr
    <IfModule log_config_module>
        CustomLog /dev/stdout combined
    </IfModule>

    <Directory /var/www/public>
        Options +FollowSymLinks -Indexes
        AllowOverride All

        <IfModule authz_core_module>
            Require all granted
        </IfModule>
        # No legacy Order/Allow fallback here — use mod_access_compat instead if needed.
    </Directory>

    DirectoryIndex index.php index.html

    # CORS headers (requires mod_headers)
    <IfModule headers_module>
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Headers "Authorization,Accept,Origin,DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Content-Range,Range"
        Header always set Access-Control-Allow-Methods "GET,POST,OPTIONS,PUT,DELETE,PATCH"
    </IfModule>

    # Rewrite (requires mod_rewrite)
    <IfModule rewrite_module>
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ /index.php?q=$1 [L,QSA]
    </IfModule>

    # PHP-FPM via Unix socket (requires mod_proxy and mod_proxy_fcgi)
    <FilesMatch "\.php$">
        <IfModule proxy_fcgi_module>
            SetHandler "proxy:unix:/run/php-fpm.sock|fcgi://localhost/"
        </IfModule>
    </FilesMatch>

    # Error pages
    ErrorDocument 500 /50x.html
    ErrorDocument 502 /50x.html
    ErrorDocument 503 /50x.html
    ErrorDocument 504 /50x.html
    Alias /50x.html /var/www/public/50x.html

    # Cache-control for static assets (requires mod_expires)
    <IfModule expires_module>
        <FilesMatch "\.(jpg|jpeg|gif|png|css|js|ico|xml)$">
            ExpiresActive On
            ExpiresDefault "access plus 5 days"
        </FilesMatch>
    </IfModule>

    # Deny dotfiles
    <IfModule authz_core_module>
        <FilesMatch "^\." >
            Require all denied
            ErrorDocument 403 "Access Denied"
        </FilesMatch>
    </IfModule>

    # FPM status/ping (localhost only)
    <LocationMatch "^/(fpm-status|fpm-ping)$">
        <IfModule authz_core_module>
            <RequireAny>
                Require ip 172.17.0.0/16
            </RequireAny>
        </IfModule>

        <IfModule proxy_fcgi_module>
            SetHandler "proxy:unix:/run/php-fpm.sock|fcgi://localhost/"
        </IfModule>
    </LocationMatch>

    <IfModule negotiation_module>
        # existing language/negotiation directives, e.g.:
        LanguagePriority en cs da de el es et fi fr hi hr it ja ko nl no pl pt pt-BR ru sv tr uk zh-CN zh-TW
        ForceLanguagePriority Prefer Fallback
        AddLanguage en .en
        AddLanguage fr .fr
        AddLanguage es .es
        # ...etc
    </IfModule>
</VirtualHost>